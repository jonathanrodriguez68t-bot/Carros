<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Museo Sport Cars | Categoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body { background-color: #111; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; }
        .form-section { padding: 100px 0 60px 0; }
        .card-form { background: #1a1a1a; border: 1px solid #2a2a2a; border-top: 3px solid #CC0000; border-radius: 8px; }
        .card-form .card-header { background: transparent; border-bottom: 1px solid #2a2a2a; padding: 20px 24px; }
        .card-form .card-header h4 { color: #fff; font-weight: 700; margin: 0; }
        .card-form .card-header h4 span { color: #CC0000; }
        .card-body { padding: 24px; }
        label { color: #aaa; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        .form-control, .form-select { background:#111; border:1px solid #333; color:#fff; }
        .form-control:focus { background:#111; border-color:#CC0000; color:#fff; box-shadow: 0 0 0 2px rgba(204,0,0,0.2); }
        .form-control::placeholder { color:#555; }
        .form-check-input:checked { background-color:#CC0000; border-color:#CC0000; }
        .btn-guardar { background:#CC0000; color:#fff; border:none; font-weight:700; letter-spacing:1px; padding:10px 30px; }
        .btn-guardar:hover { background:#aa0000; color:#fff; }
        .btn-cancelar { background:transparent; color:#888; border:1px solid #333; padding:10px 24px; }
        .btn-cancelar:hover { border-color:#666; color:#fff; }
    </style>
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color:#0a0a0a; border-bottom:2px solid #CC0000;">
            <div class="container-fluid px-4">
                <a class="navbar-brand" th:href="@{/}">
                    <span style="color:#CC0000;">&#9632;</span>
                    <strong style="color:#fff; letter-spacing:2px;"> MUSEO</strong>
                    <span style="color:#CC0000; font-weight:300;"> SPORT</span>
                </a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" th:href="@{/}" style="color:#ccc;">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/tabla}" style="color:#ccc;">Colección</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/categorias/index}" style="color:#ccc;">Categorías</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="form-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="card-form">
                        <div class="card-header">
                            
                            <h4>&#9632; <span th:text="${accion ?: 'Formulario'}"></span> <span style="color:#fff;">de Categoría</span></h4>
                        </div>
                        <div class="card-body">
                           
                            <form th:action="@{/categorias/save}" method="post" th:object="${categoria}">
                                <input type="hidden" th:field="*{id}">

                                <div class="mb-3">
                                    
                                    <label>Nombre de la Categoría</label>
                                    <input type="text" class="form-control" name="nomCategoria"
                                           th:field="*{nomCategoria}"
                                           placeholder="Ej: Superdeportivo, Hypercar..." required>
                                </div>

                                <div class="mb-3">
                                   
                                    <label>Descripción</label>
                                    <textarea class="form-control" name="descripcion"
                                              th:field="*{descripcion}"
                                              rows="3"
                                              placeholder="Describe qué tipo de autos pertenecen a esta categoría..."></textarea>
                                </div>

                                <div class="mb-4">
                                    <label>Estado</label>
                                    <div class="form-check mt-2">
                                        <input class="form-check-input" type="checkbox"
                                               name="activo" id="activo"
                                               th:checked="${categoria.activo}" value="true">
                                        <label class="form-check-label" for="activo"
                                               style="text-transform:none; color:#ccc;">Categoría activa en el museo</label>
                                    </div>
                                </div>

                                <hr style="border-color:#333;">
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-guardar">&#10003; Guardar</button>
                                    <a th:href="@{/categorias/index}" class="btn btn-cancelar">Cancelar</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
