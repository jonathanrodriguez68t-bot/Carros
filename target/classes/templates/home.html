<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Museo de carrasos de lujo | Marcas de Autos Deportivos</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body {
            background-color: #111;
            color: #e0e0e0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        .hero-section {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0000 50%, #0a0a0a 100%);
            padding: 120px 0 60px 0;
            border-bottom: 3px solid #CC0000;
        }
        .hero-section h1 {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
        }
        .hero-section h1 span {
            color: #CC0000;
        }
        .hero-section p {
            color: #aaa;
            font-size: 1.1rem;
        }
        .search-box input, .search-box select {
            background-color: #1e1e1e;
            border: 1px solid #444;
            color: #fff;
        }
        .search-box input::placeholder { color: #777; }
        .btn-search {
            background-color: #CC0000;
            color: #fff;
            border: none;
            font-weight: 600;
            padding: 8px 24px;
        }
        .btn-search:hover { background-color: #aa0000; color: #fff; }

       
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #CC0000;
            text-transform: uppercase;
        }
        .section-divider {
            border: none;
            border-top: 2px solid #CC0000;
            width: 60px;
            margin: 8px auto 30px auto;
        }

        .marca-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            transition: all 0.3s ease;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .marca-card:hover {
            border-color: #CC0000;
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(204,0,0,0.2);
        }
        .marca-img-wrap {
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 180px;
        }
        .marca-img-wrap img {
            max-width: 100%;
            max-height: 150px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(204,0,0,0.3));
        }
        .marca-img-placeholder {
            font-size: 4rem;
            color: #333;
        }
        .marca-info { padding: 20px; }
        .marca-nombre { font-size: 1.5rem; font-weight: 800; color: #fff; }
        .marca-pais { color: #CC0000; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
        .marca-desc { color: #999; font-size: 0.9rem; margin: 10px 0; line-height: 1.5; }
        .marca-badge { background: #CC0000; color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 2px; font-weight: 700; }
        .marca-stat { color: #777; font-size: 0.8rem; }
        .marca-stat span { color: #fff; font-weight: 600; }
        .btn-detalle {
            background: transparent;
            color: #CC0000;
            border: 1px solid #CC0000;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 18px;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .btn-detalle:hover {
            background: #CC0000;
            color: #fff;
        }
    </style>
</head>
<body>

    <header th:insert="fragments/menu :: menu-principal"></header>

    <section class="hero-section">
        <div class="container">
            <p class="section-title mb-2">Bienvenido al</p>
            <h1>MUSEO <span>SPORT</span> CARS</h1>
            <p class="mt-3">Explora las marcas más icónicas del automovilismo deportivo mundial.<br>
               Historia, ingeniería y pasión en una sola colección.</p>
               
               
                 <!--AQUIIII ES DONDE SE utiliza el botom buscar y tambien 
                 el buscar por ID 1, 2-->
       <form th:action="@{/}" method="get" 
     		class="d-flex gap-2 flex-wrap search-box mt-4">
    		<input type="text" class="form-control" style="max-width:280px;"
           	name="buscar"
           	th:value="${buscar}"
           	placeholder="Buscar marca...">
    		<select class="form-select" style="max-width:200px;" name="idCategoria">
        	<option value="">Todas las categorías</option>
        	
        	   <!--Este es el form de busqueda-->
        	<option th:each="cat : ${categorias}" 
               th:value="${cat.id}" 
               th:text="${cat.nomCategoria}"
               th:selected="${cat.id == idCategoria}"></option>
    		</select>
    		<button type="submit" class="btn btn-search">Buscar</button>
		</form>

            
        </div>
    </section>

    <main>
        <div class="container mt-5">
            <div class="text-center mb-4">
                <p class="section-title">Marcas Destacadas</p>
                <hr class="section-divider">
            </div>

               <!--Aqui hace el coso para mostrar las marcas destacada -->
            <div class="row" th:if="${marcas}">
                <div class="col-md-6 col-lg-4" th:each="marca : ${marcas}" th:if="${marca.destacado == 1}">
                    <div class="marca-card">
                        <div class="marca-img-wrap">
                            
                            <img th:src="@{/images/{img}(img=${marca.imagen})}"
                                 th:alt="${marca.nombre}"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                            <div class="marca-img-placeholder" style="display:none;">🏎</div>
                        </div>
                        <div class="marca-info">
                            <div class="d-flex justify-content-between align-items-start mb-1">
                                <h3 class="marca-nombre mb-0" th:text="${marca.nombre}"></h3>
                                <span class="marca-badge">DESTACADO</span>
                            </div>
                            <p class="marca-pais mb-2" th:text="${marca.paisOrigen + ' · ' + marca.anioFundacion}"></p>
                            <p class="marca-desc" th:text="${marca.descripcion}"></p>
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <div class="marca-stat">
                                    Vel. Máx: <span th:text="${marca.velocidadMax + ' km/h'}"></span>
                                </div>
                                <a class="btn btn-detalle" th:href="@{/marcas/view/{id}(id=${marca.id})}">
                                    Ver más &rarr;
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            
            <div class="text-center mt-4 mb-5">
                <hr class="section-divider">
                <p class="section-title">Toda la Colección</p>
                <hr class="section-divider">
            </div>

            <div class="row">
                <div class="col-md-6 col-lg-4" th:each="marca : ${marcas}" th:unless="${marca.destacado == 1}">
                    <div class="marca-card">
                        <div class="marca-img-wrap">
                            <img th:src="@{/images/{img}(img=${marca.imagen})}"
                                 th:alt="${marca.nombre}"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                            <div class="marca-img-placeholder" style="display:none;">🏎</div>
                        </div>
                        <div class="marca-info">
                            <h3 class="marca-nombre" th:text="${marca.nombre}"></h3>
                            <p class="marca-pais mb-2" th:text="${marca.paisOrigen + ' · ' + marca.anioFundacion}"></p>
                            <p class="marca-desc" th:text="${marca.descripcion}"></p>
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <div class="marca-stat">
                                    Vel. Máx: <span th:text="${marca.velocidadMax + ' km/h'}"></span>
                                </div>
                                <a class="btn btn-detalle" th:href="@{/marcas/view/{id}(id=${marca.id})}">
                                    Ver más &rarr;
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:insert="fragments/footer :: pie-pagina"></footer>

    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
