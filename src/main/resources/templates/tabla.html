<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Colección - Museo Sport Cars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body { background-color: #111; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; }

        .page-header {
            background: linear-gradient(90deg, #0a0a0a, #1a0000);
            border-bottom: 2px solid #CC0000;
            padding: 100px 0 30px 0;
        }
        .page-title { font-size:2rem; font-weight:900; letter-spacing:3px; color:#fff; }
        .page-title span { color: #CC0000; }

        /* Tabla */
        .table-dark-custom { background: #1a1a1a; border-radius: 8px; overflow: hidden; }
        .table-dark-custom thead th {
            background-color: #CC0000;
            color: #fff;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.8rem;
            padding: 14px 12px;
            border: none;
        }
        .table-dark-custom tbody tr {
            background-color: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            transition: background 0.2s;
        }
        .table-dark-custom tbody tr:hover { background-color: #222; }
        .table-dark-custom td { vertical-align: middle; color: #ccc; padding: 12px; border: none; }

        .marca-img { object-fit: contain; background: #111; padding: 4px; border-radius: 4px; }

        .badge-si { background-color: #CC0000; color: #fff; padding: 4px 10px; border-radius: 3px; font-size:0.75rem; font-weight:700; }
        .badge-no { background-color: #333; color: #888; padding: 4px 10px; border-radius: 3px; font-size:0.75rem; font-weight:700; }

        /* BOTONES ASI BIEN PRO DEL CRUD */
        .btn-ver    { background:transparent; color:#4da6ff; border:1px solid #4da6ff; font-size:0.8rem; padding:4px 12px; }
        .btn-ver:hover { background:#4da6ff; color:#000; }
        .btn-editar { background:transparent; color:#ffc107; border:1px solid #ffc107; font-size:0.8rem; padding:4px 12px; }
        .btn-editar:hover { background:#ffc107; color:#000; }
        .btn-elim   { background:transparent; color:#CC0000; border:1px solid #CC0000; font-size:0.8rem; padding:4px 12px; }
        .btn-elim:hover { background:#CC0000; color:#fff; }

        .nueva-marca-btn {
            background: #CC0000; color: #fff; border: none;
            font-weight: 700; letter-spacing: 1px; padding: 8px 22px;
        }
        .nueva-marca-btn:hover { background: #aa0000; color: #fff; }

        .vel-text { color: #CC0000; font-weight: 700; }
    </style>
</head>
<body>

   
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color:#0a0a0a; border-bottom:2px solid #CC0000;">
            <div class="container-fluid px-4">
                <a class="navbar-brand" th:href="@{/}">
                    <span style="color:#CC0000;">&#9632;</span>
                    <strong style="color:#fff; letter-spacing:2px;">MUSEO</strong>
                    <span style="color:#CC0000; font-weight:300;"> SPORT</span>
                </a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}" style="color:#ccc;">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/tabla}" style="color:#CC0000; font-weight:600;">Colección</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/categorias/index}" style="color:#ccc;">Categorías</a>
                        </li>
                    </ul>
                    <a class="btn nueva-marca-btn btn-sm" th:href="@{/marcas/create}">+ Nueva Marca</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- HEADER AQUIIIIIIIIIIII -->
    <div class="page-header">
        <div class="container">
            <p class="mb-1" style="color:#CC0000; font-size:0.85rem; letter-spacing:3px; text-transform:uppercase;">Administración</p>
            <h1 class="page-title">COLECCIÓN DE <span>MARCAS</span></h1>
        </div>
    </div>

    <div class="container mt-4 pb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span style="color:#888; font-size:0.9rem;">
                Total: <strong style="color:#CC0000;" th:text="${marcas != null ? marcas.size() : 0}"></strong> marcas registradas
            </span>
            <a class="btn nueva-marca-btn btn-sm" th:href="@{/marcas/create}">+ Agregar Marca</a>
        </div>

        <div class="table-dark-custom shadow">
            <div class="table-responsive">
                
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>Logo</th>
                            <th>ID</th>
                            <th>Marca</th>
                            <th>País</th>
                            <th>Fundada</th>
                            <th>Vel. Máx (km/h)</th>
                            <th class="text-center">Destacado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                        <tr th:each="marca : ${marcas}">
                            <td>
                                <img th:src="@{/images/{img}(img=${marca.imagen})}"
                                     width="70" height="50" class="marca-img"
                                     th:alt="${marca.nombre}"
                                     onerror="this.style.opacity='0.3'"/>
                            </td>
                            <td><strong th:text="${marca.id}" style="color:#CC0000;"></strong></td>
                            <td><strong th:text="${marca.nombre}" style="color:#fff;"></strong></td>
                            <td th:text="${marca.paisOrigen}"></td>
                            <td th:text="${marca.anioFundacion}"></td>
                            <td><span class="vel-text" th:text="${marca.velocidadMax}"></span> km/h</td>
                            <td class="text-center">
                                <span th:if="${marca.destacado == 1}" class="badge-si">SÍ</span>
                                <span th:unless="${marca.destacado == 1}" class="badge-no">NO</span>
                            </td>
                            
                            <td class="text-center">
                            
                             <!-- AQUI ESTA EL MENSAJE DE ALERTA -->
                                <div class="d-flex gap-1 justify-content-center">
                                    <a th:href="@{/marcas/view/{id}(id=${marca.id})}" class="btn btn-ver btn-sm">Ver</a>
                                    <a th:href="@{/marcas/edit/{id}(id=${marca.id})}" class="btn btn-editar btn-sm">Editar</a>
                                    <a th:href="@{/marcas/delete/{id}(id=${marca.id})}" class="btn btn-elim btn-sm"
                                       onclick="return confirm('¿Eliminar esta marca del museo?')">Eliminar</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer style="background:#0a0a0a; border-top:2px solid #CC0000; padding:16px 0; margin-top:20px;">
        <div class="container text-center">
            <p style="color:#555; font-size:0.8rem; margin:0;">
                &copy; 2026 <span style="color:#CC0000;">Museo Sport Cars</span> | Spring Boot MVC
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
