<!DOCTYPE html>
<!-- CAMBIO: Formulario cambiado de Trip a Marca -->
<!-- CAMBIO: Campos: nombre, descripcion, paisOrigen, anioFundacion, velocidadMax, destacado, imagen -->
<!-- CAMBIO: Action cambiado a /marcas/save -->
<!-- CAMBIO: Diseño con tema oscuro/rojo del museo -->
<!-- CAMBIO: Sirve tanto para crear (id=null) como para editar (id tiene valor) -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Museo Sport Cars | Formulario Marca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body { background-color: #111; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; }

        .form-section {
            padding: 100px 0 60px 0;
        }
        .card-form {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-top: 3px solid #CC0000;
            border-radius: 8px;
        }
        .card-form .card-header {
            background: transparent;
            border-bottom: 1px solid #2a2a2a;
            padding: 20px 24px;
        }
        .card-form .card-header h4 {
            color: #fff;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 0;
        }
        .card-form .card-header h4 span { color: #CC0000; }
        .card-body { padding: 24px; }

        label { color: #aaa; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px; }

        .form-control, .form-select {
            background-color: #111;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #111;
            border-color: #CC0000;
            color: #fff;
            box-shadow: 0 0 0 2px rgba(204,0,0,0.2);
        }
        .form-control::placeholder { color: #555; }
        .form-select option { background: #111; color: #fff; }

        .form-check-input:checked { background-color: #CC0000; border-color: #CC0000; }

        .btn-guardar {
            background: #CC0000; color: #fff; border: none;
            font-weight: 700; letter-spacing: 1px; padding: 10px 30px;
        }
        .btn-guardar:hover { background: #aa0000; color: #fff; }
        .btn-cancelar {
            background: transparent; color: #888;
            border: 1px solid #333; padding: 10px 24px;
        }
        .btn-cancelar:hover { border-color: #666; color: #fff; }

        .alert-danger { background: #2a0000; border: 1px solid #CC0000; color: #ff9999; }
    </style>
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color:#0a0a0a; border-bottom:2px solid #CC0000;">
            <div class="container-fluid px-4">
                <a class="navbar-brand" th:href="@{/}">
                    <span style="color:#CC0000;">&#9632;</span>
                    <strong style="color:#fff; letter-spacing:2px;"> MUSEO</strong>
                    <span style="color:#CC0000; font-weight:300;"> SPORT</span>
                </a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" th:href="@{/}" style="color:#ccc;">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/tabla}" style="color:#ccc;">Colección</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/categorias/index}" style="color:#ccc;">Categorías</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="form-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">

                    <div class="card-form">
                        <!-- TITULO GOOD -->
                        <div class="card-header">
                            <h4>&#9632; <span th:text="${accion ?: 'Formulario'}"></span> <span style="color:#fff;">de Marca</span></h4>
                        </div>
                        <div class="card-body">

                            <!-- AQUI ES DONDE APUNTA A LA MARCA -->
                            <form th:action="@{/marcas/save}" method="post" th:object="${marca}">

                                <!-- Campo oculto para el id (necesario para editar) -->
                                <!-- CAMBIO: En TripAN no había update; aquí se pasa el id para distinguir crear/editar -->
                                <input type="hidden" th:field="*{id}">

                                <!-- Errores de validación -->
                                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger mb-3">
                                    Por favor corrija los siguientes errores:
                                    <ul class="mb-0 mt-1">
                                        <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                                    </ul>
                                </div>

                                <!-- Fila 1: Nombre y País de Origen -->
                                <!-- CAMBIO: Nombre del campo cambiado de "nombre del trip" a "nombre de la marca" -->
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label>Nombre de la Marca</label>
                                        <input type="text" class="form-control" name="nombre"
                                               th:field="*{nombre}"
                                               placeholder="Ej: Ferrari, Lamborghini..."
                                               required>
                                    </div>
                                    <div class="col-md-6">
                                        <!-- CAMBIO: Campo "paisOrigen" nuevo, no existía en TripAN -->
                                        <label>País de Origen</label>
                                        <select class="form-select" name="paisOrigen" th:field="*{paisOrigen}">
                                            <option value="">Seleccione un país</option>
                                            <option value="Italia">Italia</option>
                                            <option value="Alemania">Alemania</option>
                                            <option value="Reino Unido">Reino Unido</option>
                                            <option value="Francia">Francia</option>
                                            <option value="Japón">Japón</option>
                                            <option value="Estados Unidos">Estados Unidos</option>
                                            <option value="Suecia">Suecia</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Fila 2: Año de fundación y Velocidad máxima -->
                                <!-- CAMBIO: anioFundacion reemplaza a fecha; velocidadMax reemplaza a costo -->
                                <div class="row mb-3">
                                    <div class="col-md-4">
                                        <label>Año de Fundación</label>
                                        <input type="number" class="form-control" name="anioFundacion"
                                               th:field="*{anioFundacion}"
                                               placeholder="Ej: 1947" min="1880" max="2024">
                                    </div>
                                    <div class="col-md-4">
                                        <label>Velocidad Máxima (km/h)</label>
                                        <input type="number" class="form-control" name="velocidadMax"
                                               th:field="*{velocidadMax}"
                                               placeholder="Ej: 340" step="0.1">
                                    </div>
                                    <div class="col-md-4">
                                        <!-- CAMBIO: destacado mantiene misma lógica que TripAN (radio 1/0) -->
                                        <label>¿Destacado en el Museo?</label>
                                        <div class="mt-2">
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio"
                                                       name="destacado" value="1"
                                                       th:checked="${marca.destacado == 1}">
                                                <label class="form-check-label" style="text-transform:none; color:#ccc;">Sí, destacar</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio"
                                                       name="destacado" value="0"
                                                       th:checked="${marca.destacado != 1}">
                                                <label class="form-check-label" style="text-transform:none; color:#ccc;">No destacar</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Fila 3: Descripción -->
                                <div class="row mb-3">
                                    <div class="col-12">
                                        <!-- CAMBIO: descripcion misma lógica pero para la marca -->
                                        <label>Descripción de la Marca</label>
                                        <textarea class="form-control" name="descripcion"
                                                  th:field="*{descripcion}"
                                                  rows="4"
                                                  placeholder="Historia, características y legado de la marca..."></textarea>
                                    </div>
                                </div>

                                <!-- Fila 4: Imagen -->
                                <div class="row mb-4">
                                    <div class="col-md-6">
                                        <!-- CAMBIO: nombre del campo "imagen" igual que TripAN -->
                                        <label>Nombre de Imagen (archivo)</label>
                                        <input type="text" class="form-control" name="imagen"
                                               th:field="*{imagen}"
                                               placeholder="Ej: ferrari.png">
                                        <small style="color:#555;">Coloca el archivo en /static/images/</small>
                                    </div>
                                </div>

                                <hr style="border-color:#333;">

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-guardar">
                                        &#10003; Guardar Marca
                                    </button>
                                    <a th:href="@{/tabla}" class="btn btn-cancelar">
                                        Cancelar
                                    </a>
                                </div>

                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
